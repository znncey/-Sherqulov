<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хусниддин Шеркулов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111111;
    }
    .card {
      width: 90%;
      max-width: 420px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 35px;
    }
    .button {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      text-decoration: none;
      color: #111;
      font-size: 16px;
      font-weight: 500;
      transition: 0.2s;
    }
    .button:hover {
      background: #f5f5f5;
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Хусниддин Шеркулов</h1>
    <div class="subtitle">Personal contact</div>
    <a class="button"
       href="https://instagram.com/sherqulov.o1"
       target="_blank">
      Instagram
    </a>
    <a class="button"
       href="https://t.me/sherqulov1"
       target="_blank">
      Telegram
    </a>
    <a class="button"
       href="tel:+998880749939">
      Позвонить
    </a>
    <div class="footer">
      Digital Card
    </div>
  </div>
</body>
</html>
